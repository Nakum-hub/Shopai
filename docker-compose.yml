# =============================================================================
# StoreCraft AI - Docker Compose Configuration
# =============================================================================
# Usage: docker-compose up --build
# =============================================================================
# Architecture: PostgreSQL 16 + Redis 7 + BullMQ Queues
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 (Primary Database)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: storecraft-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: storecraft
      POSTGRES_USER: storecraft
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storecraft_prod_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storecraft -d storecraft"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - storecraft-network

  # ---------------------------------------------------------------------------
  # Redis 7 (Cache + Queue Backend)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: storecraft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --save 300 100
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - storecraft-network

  # ---------------------------------------------------------------------------
  # Main Application (Next.js)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: storecraft-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://storecraft:${DB_PASSWORD:-storecraft_prod_password}@postgres:5432/storecraft?connection_limit=10&pool_timeout=30
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      generation-service:
        condition: service_healthy
    networks:
      - storecraft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Generation Service (WebSocket Pipeline Orchestrator)
  # ---------------------------------------------------------------------------
  generation-service:
    build:
      context: .
      dockerfile: mini-services/generation-service/Dockerfile
    container_name: storecraft-generation
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://storecraft:${DB_PASSWORD:-storecraft_prod_password}@postgres:5432/storecraft?connection_limit=5&pool_timeout=30
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - storecraft-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Production)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: storecraft-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - storecraft-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  storecraft-network:
    driver: bridge
