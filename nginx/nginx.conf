# =============================================================================
# StoreCraft AI - Nginx Reverse Proxy Configuration
# =============================================================================
# Routes traffic to Next.js app, generation service, WebSocket gateway.
# Configured for HTTP (development/demo). For production HTTPS, add
# SSL certificate paths and uncomment the SSL directives below.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream_addr=$upstream_addr '
                    'response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------------------------------------------------------------------------
    # Upstream: Next.js Application
    # ---------------------------------------------------------------------------
    upstream nextjs_app {
        server app:3000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Upstream: Generation Service (Website Generation Pipeline)
    # ---------------------------------------------------------------------------
    upstream generation_service {
        server generation-service:3002;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Upstream: WebSocket Gateway (Real-time Communication)
    # ---------------------------------------------------------------------------
    upstream ws_gateway {
        server ws-gateway:3005;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect (uncomment for production with SSL)
    # ---------------------------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ---------------------------------------------------------------------------
    # Main Server Block
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---------------------------------------------------------------------------
        # SSL Configuration (uncomment for production)
        # ---------------------------------------------------------------------------
        # listen 443 ssl http2;
        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        # ssl_prefer_server_ciphers off;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;

        # ---------------------------------------------------------------------------
        # WebSocket Gateway (Socket.IO namespaces)
        # Namespaces: /generation, /chat, /admin, /monitoring
        # ---------------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://ws_gateway/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # WebSocket gateway health
        location /ws/health {
            proxy_pass http://ws_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------------------------------------
        # Legacy WebSocket (Generation Service)
        # ---------------------------------------------------------------------------
        location /ws/generation/ {
            proxy_pass http://generation_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ---------------------------------------------------------------------------
        # Generation Service API
        # ---------------------------------------------------------------------------
        location /api/generate/ {
            proxy_pass http://generation_service/api/generate/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Generation service health
        location /api/generation/health {
            proxy_pass http://generation_service/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---------------------------------------------------------------------------
        # Next.js Application (catch-all)
        # ---------------------------------------------------------------------------
        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Static files - long cache
        location /_next/static/ {
            proxy_pass http://nextjs_app;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Images and assets - medium cache
        location /templates/ {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }

        location /design-library/ {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=86400";
        }

        # Favicon and icons
        location ~* \.(ico|png|svg|jpg|jpeg|gif|webp|woff|woff2)$ {
            proxy_pass http://nextjs_app;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
        }
    }
}
